  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

462c-8375-104cb2c8b9f3\" alt=\"Quantivreach logo\" style=\"width:36px;height:36px;border-radius:9px;object-fit:cover;\"><span style=\"font-size:21px;font-weight:700;letter-spacing:-0.02em;\">Quantivreach<\u002Fspan><\u002Fa><div style=\"display:flex;align-items:center;gap:34px;\"><a class=\"lnk on\" href=\"Main.dc.html\">Home<\u002Fa><a class=\"lnk\" href=\"Services.dc.html\">Services<\u002Fa><a class=\"lnk\" href=\"Pricing.dc.html\">Pricing<\u002Fa><a class=\"lnk\" href=\"CaseStudies.dc.html\">Case studies<\u002Fa><a class=\"lnk\" href=\"About.dc.html\">About<\u002Fa><a href=\"Contact.dc.html\" class=\"btn btn-p\" style=\"padding:10px 22px;\">Book a call<\u002Fa><\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"glow\" style=\"width:100%;color:#fff;\"><div class=\"wrap\" style=\"padding-top:96px;padding-bottom:88px;display:grid;grid-template-columns:1.25fr 1fr;gap:56px;align-items:center;\"><div class=\"reveal\" style=\"display:flex;flex-direction:column;gap:26px;align-items:flex-start;\"><div class=\"chip chip-g\">B2B outbound &amp; GTM partner<\u002Fdiv><h1 style=\"font-size:68px;\">Outbound that books meetings, <em class=\"s\">run for you.<\u002Fem><\u002Fh1><p style=\"font-size:19px;line-height:1.6;color:#C3D2F7;max-width:560px;\">We help agencies and SaaS teams build and run a predictable pipeline: ICP, data, tooling, LinkedIn, email and cold calling, all managed by one team and reported weekly.<\u002Fp><div style=\"display:flex;gap:12px;\"><a href=\"Contact.dc.html\" class=\"btn btn-p\">Book a call<\u002Fa><a href=\"Pricing.dc.html\" class=\"btn btn-o\">See pricing<\u002Fa><\u002Fdiv><\u002Fdiv><div class=\"glass reveal\" style=\"padding:28px;display:flex;flex-direction:column;gap:18px;\"><div class=\"mono\" style=\"color:#8FA8E8;\">What a month looks like<\u002Fdiv><div style=\"display:flex;gap:12px;align-items:flex-start;font-size:15.5px;line-height:1.5;\"><span class=\"tick tick-d\">✓<\u002Fspan><span>Targeted lists built around your ICP<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:12px;align-items:flex-start;font-size:15.5px;line-height:1.5;\"><span class=\"tick tick-d\">✓<\u002Fspan><span>Personalised outreach, written with AI and checked by people<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:12px;align-items:flex-start;font-size:15.5px;line-height:1.5;\"><span class=\"tick tick-d\">✓<\u002Fspan><span>Booked calls handed to your closers<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:12px;align-items:flex-start;font-size:15.5px;line-height:1.5;\"><span class=\"tick tick-d\">✓<\u002Fspan><span>Weekly reporting on replies, meetings and pipeline<\u002Fspan><\u002Fdiv><div style=\"padding-top:16px;border-top:1px solid rgba(255,255,255,.16);font-size:14px;color:#B9C8F2;line-height:1.5;\">One owner for strategy, copy, data and calling. No hand-offs between freelancers.<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"width:100%;background:#fff;border-bottom:1px solid #E3EAF9;\"><div class=\"wrap\" style=\"padding-top:34px;padding-bottom:34px;display:flex;flex-direction:column;gap:18px;align-items:center;\"><div class=\"mono\" style=\"color:#5C6584;\">Teams we have worked with<\u002Fdiv><div style=\"display:flex;align-items:center;gap:28px;flex-wrap:wrap;justify-content:center;\"><img src=\"c7037259-237c-4e51-a095-16ef72a90f86\" alt=\"YC\" style=\"height:34px;width:auto;max-width:92px;object-fit:contain;border-radius:8px;\"><img src=\"b0ac9e0d-6aad-4c7d-8b7c-4aec7963b329\" alt=\"Antler\" style=\"height:34px;width:auto;max-width:92px;object-fit:contain;border-radius:8px;\"><img src=\"514356eb-2a6f-4487-a7eb-d5aa452fc1e2\" alt=\"Shark Tank\" style=\"height:34px;width:auto;max-width:92px;object-fit:contain;border-radius:8px;\"><img src=\"14eb6353-cd4a-431e-aca8-6bb3eb49ca1c\" alt=\"Beliv8motion\" style=\"height:34px;width:auto;max-width:92px;object-fit:contain;border-radius:8px;\"><img src=\"ffac2e4f-6003-47dc-9413-926605a67e61\" alt=\"What a Story\" style=\"height:34px;width:auto;max-width:92px;object-fit:contain;border-radius:8px;\"><img src=\"9152fb4c-bf1b-4799-86be-d3be15cb4688\" alt=\"TestParty\" style=\"height:34px;width:auto;max-width:92px;object-fit:contain;border-radius:8px;\"><img src=\"0f95875a-eddb-4c22-88ca-3340b61539f5\" alt=\"A Man &amp; His Cave\" style=\"height:34px;width:auto;max-width:92px;object-fit:contain;border-radius:8px;\"><\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"wrap sec\"><div class=\"reveal\" style=\"max-width:720px;\"><div class=\"chip chip-l\">Why teams call us<\u002Fdiv><h2 style=\"font-size:46px;margin-top:16px;\">The problems we get hired to <em class=\"s\">solve<\u002Fem><\u002Fh2><\u002Fdiv><div style=\"margin-top:44px;display:grid;grid-template-columns:1fr 1fr;gap:20px;\"><div class=\"card reveal\" style=\"padding:28px;display:grid;grid-template-columns:1fr 1fr;gap:28px;\"><div><div class=\"mono\" style=\"color:#B24A4A;\">Problem<\u002Fdiv><h3 style=\"font-size:22px;margin-top:10px;\">We have no outbound motion<\u002Fh3><p style=\"margin-top:10px;color:#5C6584;line-height:1.6;\">The founder is the only seller and pipeline is feast or famine.<\u002Fp><\u002Fdiv><div style=\"background:#F5F7FC;border-radius:14px;padding:20px;\"><div class=\"mono\" style=\"color:#0166FF;\">How we fix it<\u002Fdiv><p style=\"margin-top:10px;line-height:1.6;color:#1B2342;\">We design the ICP, the offer and the sequences, then run them every week.<\u002Fp><\u002Fdiv><\u002Fdiv><div class=\"card reveal\" style=\"padding:28px;display:grid;grid-template-columns:1fr 1fr;gap:28px;\"><div><div class=\"mono\" style=\"color:#B24A4A;\">Problem<\u002Fdiv><h3 style=\"font-size:22px;margin-top:10px;\">Our SDR hire did not work out<\u002Fh3><p style=\"margin-top:10px;color:#5C6584;line-height:1.6;\">Hiring, training and managing takes months before a single call is booked.<\u002Fp><\u002Fdiv><div style=\"background:#F5F7FC;border-radius:14px;padding:20px;\"><div class=\"mono\" style=\"color:#0166FF;\">How we fix it<\u002Fdiv><p style=\"margin-top:10px;line-height:1.6;color:#1B2342;\">You get a trained pod from day one, without recruiting or onboarding.<\u002Fp><\u002Fdiv><\u002Fdiv><div class=\"card reveal\" style=\"padding:28px;display:grid;grid-template-columns:1fr 1fr;gap:28px;\"><div><div class=\"mono\" style=\"color:#B24A4A;\">Problem<\u002Fdiv><h3 style=\"font-size:22px;margin-top:10px;\">Our tools are a mess<\u002Fh3><p style=\"margin-top:10px;color:#5C6584;line-height:1.6;\">Five platforms, no ownership, and nobody sure what is converting.<\u002Fp><\u002Fdiv><div style=\"background:#F5F7FC;border-radius:14px;padding:20px;\"><div class=\"mono\" style=\"color:#0166FF;\">How we fix it<\u002Fdiv><p style=\"margin-top:10px;line-height:1.6;color:#1B2342;\">We select, set up and manage the stack and keep the reporting clean.<\u002Fp><\u002Fdiv><\u002Fdiv><div class=\"card reveal\" style=\"padding:28px;display:grid;grid-template-columns:1fr 1fr;gap:28px;\"><div><div class=\"mono\" style=\"color:#B24A4A;\">Problem<\u002Fdiv><h3 style=\"font-size:22px;margin-top:10px;\">Agencies promised leads, delivered noise<\u002Fh3><p style=\"margin-top:10px;color:#5C6584;line-height:1.6;\">Volume without relevance burns your domain and your brand.<\u002Fp><\u002Fdiv><div style=\"background:#F5F7FC;border-radius:14px;padding:20px;\"><div class=\"mono\" style=\"color:#0166FF;\">How we fix it<\u002Fdiv><p style=\"margin-top:10px;line-height:1.6;color:#1B2342;\">Tight targeting, small batches, human review of the copy before it sends.<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"width:100%;background:#F5F7FC;\"><div class=\"wrap sec\"><div class=\"reveal\" style=\"max-width:720px;\"><div class=\"chip chip-l\">Engagement models<\u002Fdiv><h2 style=\"font-size:46px;margin-top:16px;\">Two ways to <em class=\"s\">work with us<\u002Fem><\u002Fh2><\u002Fdiv><div style=\"margin-top:44px;display:grid;grid-template-columns:1fr 1fr;gap:24px;\"><div class=\"card reveal\" style=\"padding:36px;display:flex;flex-direction:column;gap:18px;\"><div class=\"mono\" style=\"color:#0166FF;\">Fixed-cost outbound<\u002Fdiv><h3 style=\"font-size:30px;\">Outbound lead gen, done for you<\u002Fh3><p style=\"color:#5C6584;line-height:1.6;\">A managed pod running LinkedIn, email and cold calling on a monthly subscription, with extra channels added as needed.<\u002Fp><div style=\"display:flex;gap:12px;align-items:flex-start;font-size:15.5px;line-height:1.5;\"><span class=\"tick\">✓<\u002Fspan><span>LinkedIn lead gen, email and cold calling<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:12px;align-items:flex-start;font-size:15.5px;line-height:1.5;\"><span class=\"tick\">✓<\u002Fspan><span>X, Reddit and Instagram reach when it fits<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:12px;align-items:flex-start;font-size:15.5px;line-height:1.5;\"><span class=\"tick\">✓<\u002Fspan><span>Personalised with AI, reviewed by people<\u002Fspan><\u002Fdiv><div style=\"margin-top:auto;padding-top:20px;border-top:1px solid #E3EAF9;display:flex;justify-content:space-between;align-items:center;\"><div><span style=\"font-size:30px;font-weight:700;\">$1,000+<\u002Fspan><span style=\"color:#5C6584;\"> / month<\u002Fspan><div style=\"font-size:13px;color:#5C6584;margin-top:2px;\">plus commission on closure, as agreed<\u002Fdiv><\u002Fdiv><a href=\"Pricing.dc.html\" class=\"btn btn-d\">Details<\u002Fa><\u002Fdiv><\u002Fdiv><div class=\"card reveal glow\" style=\"padding:36px;display:flex;flex-direction:column;gap:18px;color:#fff;border:none;\"><div class=\"mono\" style=\"color:#8FA8E8;\">GTM engineering<\u002Fdiv><h3 style=\"font-size:30px;\">We build the stack and run GTM end to end<\u002Fh3><p style=\"color:#C3D2F7;line-height:1.6;\">Stack selection, setup, lead generation and RevOps operations, fully managed for agencies and SaaS teams.<\u002Fp><div style=\"display:flex;gap:12px;align-items:flex-start;font-size:15.5px;line-height:1.5;\"><span class=\"tick tick-d\">✓<\u002Fspan><span>Stack selection and setup<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:12px;align-items:flex-start;font-size:15.5px;line-height:1.5;\"><span class=\"tick tick-d\">✓<\u002Fspan><span>Lead generation managed end to end<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:12px;align-items:flex-start;font-size:15.5px;line-height:1.5;\"><span class=\"tick tick-d\">✓<\u002Fspan><span>Ongoing RevOps operations<\u002Fspan><\u002Fdiv><div style=\"margin-top:auto;padding-top:20px;border-top:1px solid rgba(255,255,255,.18);display:flex;justify-content:space-between;align-items:center;\"><div><span style=\"font-size:30px;font-weight:700;\">$2,500<\u002Fspan><span style=\"color:#B9C8F2;\"> / month<\u002Fspan><div style=\"font-size:13px;color:#B9C8F2;margin-top:2px;\">plus cost of tools, as required<\u002Fdiv><\u002Fdiv><a href=\"Pricing.dc.html\" class=\"btn btn-w\">Details<\u002Fa><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"wrap sec\"><div class=\"reveal\" style=\"max-width:720px;\"><div class=\"chip chip-l\">How it works<\u002Fdiv><h2 style=\"font-size:46px;margin-top:16px;\">From first call to <em class=\"s\">booked meetings<\u002Fem><\u002Fh2><\u002Fdiv><div style=\"margin-top:44px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;\"><div class=\"card reveal\" style=\"padding:26px;display:flex;flex-direction:column;gap:12px;\"><div class=\"mono\" style=\"color:#0166FF;\">01<\u002Fdiv><h3 style=\"font-size:22px;\">Discover<\u002Fh3><p style=\"color:#5C6584;line-height:1.6;font-size:15px;\">We pin down your ICP, offer and the deals you actually want to win.<\u002Fp><\u002Fdiv><div class=\"card reveal\" style=\"padding:26px;display:flex;flex-direction:column;gap:12px;\"><div class=\"mono\" style=\"color:#0166FF;\">02<\u002Fdiv><h3 style=\"font-size:22px;\">Build<\u002Fh3><p style=\"color:#5C6584;line-height:1.6;font-size:15px;\">Lists, domains, tooling and sequences are set up and tested before anything sends.<\u002Fp><\u002Fdiv><div class=\"card reveal\" style=\"padding:26px;display:flex;flex-direction:column;gap:12px;\"><div class=\"mono\" style=\"color:#0166FF;\">03<\u002Fdiv><h3 style=\"font-size:22px;\">Launch<\u002Fh3><p style=\"color:#5C6584;line-height:1.6;font-size:15px;\">Multichannel outreach goes live in small batches so we can read the signal early.<\u002Fp><\u002Fdiv><div class=\"card reveal\" style=\"padding:26px;display:flex;flex-direction:column;gap:12px;\"><div class=\"mono\" style=\"color:#0166FF;\">04<\u002Fdiv><h3 style=\"font-size:22px;\">Report and improve<\u002Fh3><p style=\"color:#5C6584;line-height:1.6;font-size:15px;\">Weekly numbers on replies, meetings and pipeline, then we tune what the data says.<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"width:100%;background:#F5F7FC;\"><div class=\"wrap sec\"><div class=\"reveal\" style=\"max-width:720px;\"><div class=\"chip chip-l\">The difference<\u002Fdiv><h2 style=\"font-size:46px;margin-top:16px;\">Typical outsourcing vs. <em class=\"s\">Quantivreach<\u002Fem><\u002Fh2><\u002Fdiv><div class=\"card reveal\" style=\"margin-top:44px;overflow:hidden;\"><div style=\"display:grid;grid-template-columns:1.1fr 1.4fr 1.4fr;gap:20px;padding:18px 28px;background:#fff;\"><div><\u002Fdiv><div class=\"mono\" style=\"color:#5C6584;\">Typical setup<\u002Fdiv><div class=\"mono\" style=\"color:#0166FF;\">Quantivreach<\u002Fdiv><\u002Fdiv><div style=\"display:grid;grid-template-columns:1.1fr 1.4fr 1.4fr;gap:20px;padding:18px 28px;border-top:1px solid #E3EAF9;align-items:center;\"><div style=\"font-weight:700;\">Who does the work<\u002Fdiv><div style=\"color:#5C6584;\">Freelancers and tools you coordinate<\u002Fdiv><div style=\"color:#061566;font-weight:600;\"><span class=\"tick\" style=\"margin-right:10px;\">✓<\u002Fspan>One accountable team<\u002Fdiv><\u002Fdiv><div style=\"display:grid;grid-template-columns:1.1fr 1.4fr 1.4fr;gap:20px;padding:18px 28px;border-top:1px solid #E3EAF9;align-items:center;\"><div style=\"font-weight:700;\">Targeting<\u002Fdiv><div style=\"color:#5C6584;\">Big lists, light filtering<\u002Fdiv><div style=\"color:#061566;font-weight:600;\"><span class=\"tick\" style=\"margin-right:10px;\">✓<\u002Fspan>Tight ICP, small verified batches<\u002Fdiv><\u002Fdiv><div style=\"display:grid;grid-template-columns:1.1fr 1.4fr 1.4fr;gap:20px;padding:18px 28px;border-top:1px solid #E3EAF9;align-items:center;\"><div style=\"font-weight:700;\">Copy<\u002Fdiv><div style=\"color:#5C6584;\">Templates with a name merge<\u002Fdiv><div style=\"color:#061566;font-weight:600;\"><span class=\"tick\" style=\"margin-right:10px;\">✓<\u002Fspan>Personalised with AI, checked by a person<\u002Fdiv><\u002Fdiv><div style=\"display:grid;grid-template-columns:1.1fr 1.4fr 1.4fr;gap:20px;padding:18px 28px;border-top:1px solid #E3EAF9;align-items:center;\"><div style=\"font-weight:700;\">Reporting<\u002Fdiv><div style=\"color:#5C6584;\">Screenshots when you ask<\u002Fdiv><div style=\"color:#061566;font-weight:600;\"><span class=\"tick\" style=\"margin-right:10px;\">✓<\u002Fspan>Weekly numbers, shared sheet or dashboard<\u002Fdiv><\u002Fdiv><div style=\"display:grid;grid-template-columns:1.1fr 1.4fr 1.4fr;gap:20px;padding:18px 28px;border-top:1px solid #E3EAF9;align-items:center;\"><div style=\"font-weight:700;\">Your time<\u002Fdiv><div style=\"color:#5C6584;\">Managing the vendors<\u002Fdiv><div style=\"color:#061566;font-weight:600;\"><span class=\"tick\" style=\"margin-right:10px;\">✓<\u002Fspan>Showing up to booked calls<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"wrap sec\"><div class=\"reveal card\" style=\"padding:44px;display:grid;grid-template-columns:1.1fr 1fr;gap:48px;align-items:center;background:#F5F7FC;border:none;\"><div style=\"display:flex;flex-direction:column;gap:18px;align-items:flex-start;\"><div class=\"chip chip-l\">Proof<\u002Fdiv><h2 style=\"font-size:38px;\">Beliv8 Motion went from two freelancers to a 14-person team.<\u002Fh2><p style=\"color:#5C6584;line-height:1.65;font-size:17px;\">We joined as their fractional CRO about two and a half years ago, built inbound and outbound, automated the stack, and hired and trained their in-house sales team. They now run around $12K in monthly recurring revenue.<\u002Fp><a href=\"CaseStudies.dc.html\" class=\"btn btn-p\">Read the case study<\u002Fa><\u002Fdiv><div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;\"><div class=\"card\" style=\"padding:24px;\"><div style=\"font-size:40px;font-weight:700;color:#0166FF;\">~2.5 yrs<\u002Fdiv><div style=\"color:#5C6584;font-size:14px;margin-top:4px;\">as fractional CRO<\u002Fdiv><\u002Fdiv><div class=\"card\" style=\"padding:24px;\"><div style=\"font-size:40px;font-weight:700;color:#0166FF;\">2 → 14<\u002Fdiv><div style=\"color:#5C6584;font-size:14px;margin-top:4px;\">people on the team<\u002Fdiv><\u002Fdiv><div class=\"card\" style=\"padding:24px;\"><div style=\"font-size:40px;font-weight:700;color:#0166FF;\">~$12K<\u002Fdiv><div style=\"color:#5C6584;font-size:14px;margin-top:4px;\">monthly recurring revenue<\u002Fdiv><\u002Fdiv><div class=\"card\" style=\"padding:24px;\"><div style=\"font-size:40px;font-weight:700;color:#0166FF;\">6 figures<\u002Fdiv><div style=\"color:#5C6584;font-size:14px;margin-top:4px;\">pipeline generated, per the founder<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"wrap\" style=\"padding-bottom:96px;\"><div class=\"reveal\" style=\"max-width:720px;\"><div class=\"chip chip-l\">Testimonials<\u002Fdiv><h2 style=\"font-size:46px;margin-top:16px;\">What founders say<\u002Fh2><\u002Fdiv><div style=\"margin-top:40px;\"><div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;\"><div class=\"card reveal\" style=\"padding:28px;display:flex;flex-direction:column;gap:18px;\"><div style=\"color:#F5A623;font-size:15px;letter-spacing:2px;\">★★★★★<\u002Fdiv><p style=\"font-size:16px;line-height:1.6;color:#1B2342;\">“Irshad and his team aren't just BD guys. They truly understand the essence of business. They've helped us craft ICPs, build effective business development channels, and close deals. They've generated over six figures in pipeline and closed big logos for us.”<\u002Fp><div style=\"display:flex;align-items:center;gap:12px;margin-top:auto;\"><img src=\"a5a5fb8f-e480-4b47-a9b5-2e42493065b3\" alt=\"Taha Slatewala\" style=\"width:44px;height:44px;border-radius:50%;object-fit:cover;\"><div><div style=\"font-weight:700;font-size:15px;\">Taha Slatewala<\u002Fdiv><div style=\"font-size:13px;color:#5C6584;\">Co-Founder, Beliv8 Motion Studios<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"card reveal\" style=\"padding:28px;display:flex;flex-direction:column;gap:18px;\"><div style=\"color:#F5A623;font-size:15px;letter-spacing:2px;\">★★★★★<\u002Fdiv><p style=\"font-size:16px;line-height:1.6;color:#1B2342;\">“I worked with Irshad and his team at Quantivreach for outreach. They were professional and handled the process independently, and managed to book us calls with genuinely interesting companies.”<\u002Fp><div style=\"display:flex;align-items:center;gap:12px;margin-top:auto;\"><img src=\"3eeb8f42-214c-4bbe-a720-ece19952206c\" alt=\"Vikas Tiwari\" style=\"width:44px;height:44px;border-radius:50%;object-fit:cover;\"><div><div style=\"font-weight:700;font-size:15px;\">Vikas Tiwari<\u002Fdiv><div style=\"font-size:13px;color:#5C6584;\">CEO, What a Story<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"card reveal\" style=\"padding:28px;display:flex;flex-direction:column;gap:18px;\"><div style=\"color:#F5A623;font-size:15px;letter-spacing:2px;\">★★★★★<\u002Fdiv><p style=\"font-size:16px;line-height:1.6;color:#1B2342;\">“Irshad has been great to work with! Helped me close a $15,000 deal and communicated well throughout.”<\u002Fp><div style=\"display:flex;align-items:center;gap:12px;margin-top:auto;\"><img src=\"6115f2e2-620a-46b3-a947-0ed9c50dc381\" alt=\"Anmol Pandey\" style=\"width:44px;height:44px;border-radius:50%;object-fit:cover;\"><div><div style=\"font-weight:700;font-size:15px;\">Anmol Pandey<\u002Fdiv><div style=\"font-size:13px;color:#5C6584;\">Founder &amp; CEO, TheFutureAnimations<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"width:100%;background:#F5F7FC;\"><div class=\"wrap sec\" style=\"display:grid;grid-template-columns:1fr 1.6fr;gap:56px;\"><div class=\"reveal\"><div class=\"chip chip-l\">FAQ<\u002Fdiv><h2 style=\"font-size:40px;margin-top:16px;\">Questions before you book<\u002Fh2><a href=\"Contact.dc.html\" class=\"btn btn-d\" style=\"margin-top:24px;\">More answers<\u002Fa><\u002Fdiv><div class=\"reveal\"><details class=\"faq\"><summary>How fast can we start?<\u002Fsummary><p>After a discovery call and a short ICP exercise we set up domains, lists and sequences. We will give you a concrete timeline on the call, based on your tooling and how much already exists.<\u002Fp><\u002Fdetails><details class=\"faq\"><summary>Do you replace our sales team?<\u002Fsummary><p>No. We generate and qualify conversations, then hand booked calls to whoever closes for you. Some clients later have us hire and train their in-house team.<\u002Fp><\u002Fdetails><details class=\"faq\"><summary>Will outreach hurt our brand or domain?<\u002Fsummary><p>We send in small, verified batches from properly set-up infrastructure, and a person reviews copy before it goes out.<\u002Fp><\u002Fdetails><\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"glow\" style=\"width:100%;\"><div class=\"wrap sec reveal\" style=\"text-align:center;display:flex;flex-direction:column;align-items:center;gap:20px;\"><h2 style=\"font-size:46px;color:#fff;max-width:760px;\">Let's build your pipeline.<\u002Fh2><p style=\"color:#C3D2F7;font-size:18px;max-width:560px;line-height:1.55;\">Tell us who you sell to. We will tell you honestly whether outbound is the right lever and which model fits.<\u002Fp><div style=\"display:flex;gap:12px;margin-top:8px;\"><a href=\"Contact.dc.html\" class=\"btn btn-w\">Book a call<\u002Fa><a href=\"Pricing.dc.html\" class=\"btn btn-o\">See pricing<\u002Fa><\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"glow\" style=\"width:100%;color:#fff;\"><div class=\"wrap\" style=\"padding-top:64px;padding-bottom:36px;\"><div style=\"display:flex;justify-content:space-between;gap:48px;flex-wrap:wrap;\"><div style=\"max-width:360px;\"><div style=\"display:flex;align-items:center;gap:10px;\"><img src=\"c014fa50-00dc-462c-8375-104cb2c8b9f3\" alt=\"\" style=\"width:36px;height:36px;border-radius:9px;object-fit:cover;\"><span style=\"font-size:21px;font-weight:700;\">Quantivreach<\u002Fspan><\u002Fdiv><p style=\"margin-top:16px;color:#B9C8F2;font-size:15px;line-height:1.6;\">Outbound and GTM for agencies and SaaS. We build the engine, run it, and report on it.<\u002Fp><a href=\"mailto:irshad@quantivreach.com\" style=\"display:inline-block;margin-top:16px;font-weight:600;\">irshad@quantivreach.com<\u002Fa><\u002Fdiv><div style=\"display:flex;gap:80px;\"><div><div class=\"mono\" style=\"color:#8FA8E8;margin-bottom:16px;\">Company<\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:10px;\"><a href=\"About.dc.html\" style=\"color:#D6E1FF;font-size:15px;\">About<\u002Fa><a href=\"CaseStudies.dc.html\" style=\"color:#D6E1FF;font-size:15px;\">Case studies<\u002Fa><a href=\"Contact.dc.html\" style=\"color:#D6E1FF;font-size:15px;\">Contact<\u002Fa><\u002Fdiv><\u002Fdiv><div><div class=\"mono\" style=\"color:#8FA8E8;margin-bottom:16px;\">Work with us<\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:10px;\"><a href=\"Services.dc.html\" style=\"color:#D6E1FF;font-size:15px;\">Services<\u002Fa><a href=\"Pricing.dc.html\" style=\"color:#D6E1FF;font-size:15px;\">Pricing<\u002Fa><a href=\"Contact.dc.html\" style=\"color:#D6E1FF;font-size:15px;\">Book a call<\u002Fa><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"margin-top:48px;padding-top:22px;border-top:1px solid rgba(255,255,255,.14);color:#8FA8E8;font-size:13px;\">© Quantivreach. Based in Indore,
